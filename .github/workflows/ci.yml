name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high --json > npm-audit.json
      - name: Summarize dependency audit
        if: always()
        run: node -e "const a=JSON.parse(require('node:fs').readFileSync('npm-audit.json','utf8')); for (const [n,v] of Object.entries(a.vulnerabilities || {})) console.log(n + ':' + v.severity + '; direct=' + v.isDirect + '; fix=' + JSON.stringify(v.fixAvailable))"
